[project]
name = "consilium"
version = "0.1.0"
description = "An AI investment committee you can backtest, paper-trade, and interrogate — analysts, a Red Team, and a CIO over a deterministic risk engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ai", "hedge-fund", "investment-committee", "backtesting", "llm", "agents", "quant"]
dependencies = [
  "pydantic>=2.6",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyyaml>=6.0",
  "rich>=13.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "yfinance>=0.2.40",
  "anthropic>=0.40",
  "openai>=1.40",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
consilium = "consilium.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["consilium*"]

[tool.setuptools.package-data]
consilium = ["mandates/*.yaml", "dashboard/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
